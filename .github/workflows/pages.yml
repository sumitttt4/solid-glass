name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOLID_GLASS_ORIGIN: https://sumitttt4.github.io/solid-glass
      SOLID_GLASS_BASE: /solid-glass/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the documentation is generated: the types of what renders it depend on it
      - run: npm run docs
      - run: npm run typecheck
      - run: npm run build
      # A page other than the first is a path the server has no file for: it serves this, and the
      # site's own router takes it from there.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
