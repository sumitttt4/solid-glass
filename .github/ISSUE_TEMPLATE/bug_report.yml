name: Bug report
description: Something looks wrong, behaves wrong, or does not install.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Title: one sentence that says what happens, e.g. "The select menu lets the page show through in light mode".
        Security problems go through [SECURITY.md](https://github.com/sumitttt4/glazeui/blob/main/SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
      description: A screenshot helps most. Which component, and what is wrong with how it looks or behaves.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: A page on glazeui.xyz, or the smallest piece of code that shows it in your project.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - On glazeui.xyz
        - In my project
        - While installing (shadcn add)
    validations:
      required: true
  - type: dropdown
    id: finish
    attributes:
      label: Finish
      options:
        - Normal
        - Glass
        - Frost
        - Aurora
        - All of them
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Safari 19, macOS 16
