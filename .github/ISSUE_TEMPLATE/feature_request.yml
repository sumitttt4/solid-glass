name: Component or feature request
description: A component, block, icon or option you would like in Glaze.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: The component or change, and where you would use it. Links to examples elsewhere help.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What you do today instead
