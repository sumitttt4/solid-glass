<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glaze — Beautiful components, solid or glass</title>
    <meta name="description" content="Free React components: UI, AI &amp; voice and animated icons, each in four materials. Copy, install with one command, or hand it to your agent." />
    <link rel="canonical" href="https://glazeui.xyz/" />
    <meta property="og:url" content="https://glazeui.xyz/" />
    <meta property="og:title" content="Glaze — Beautiful components, solid or glass" />
    <link rel="icon" type="image/svg+xml" href="/glaze.svg" />
    <!-- The page's colour before the stylesheet arrives, so a page that is still loading is not white:
         the same two values as --background in src/solid-glass.css. -->
    <style>
      html { background: #f3f5f7; }
      html.dark { background: #000000; color-scheme: dark; }
    </style>
    <script>
      // Before first paint: the saved choice, otherwise dark, which is the material as designed.
      (function () {
        // ?theme=light or ?theme=dark shows that one for this visit, without saving it.
        var saved = new URLSearchParams(location.search).get("theme")
        try { saved = saved || localStorage.getItem("colorwork:theme") } catch (e) {}
        document.documentElement.classList.toggle("dark", saved === "dark")
        // ?material=glass|frost|aurora|solid, else the saved one, else Normal.
        var material = new URLSearchParams(location.search).get("material")
        try { material = material || localStorage.getItem("colorwork:material") } catch (e) {}
        document.documentElement.dataset.material = /^(solid|glass|frost|aurora)$/.test(material || "") ? material : "solid"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
