<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colorwork — Build your site with more color</title>
    <meta name="description" content="Explore a growing library of expressive React components. Pick a starting point, copy the code, and make it yours." />
    <link rel="icon" type="image/svg+xml" href="/color-study.svg" />
    <!-- The page's colour before the stylesheet arrives, so a page that is still loading is not white:
         the same two values as --background in src/solid-glass.css. -->
    <style>
      html { background: oklch(.96 .014 85); }
      html.dark { background: oklch(.18 .014 265); color-scheme: dark; }
    </style>
    <script>
      // Before first paint: the saved choice, otherwise dark, which is the material as designed.
      (function () {
        // ?theme=light or ?theme=dark shows that one for this visit, without saving it.
        var saved = new URLSearchParams(location.search).get("theme")
        try { saved = saved || localStorage.getItem("colorwork:theme") } catch (e) {}
        document.documentElement.classList.toggle("dark", saved === "dark")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
